org.gradle.jvmargs=-Xmx1400m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=false
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx1024m
# NOTE (v7): org.gradle.java.home is intentionally NOT set. The v6 archive
# hardcoded /tmp/my-project/.cache/jdk-17.0.21.1+2, a path that exists on one
# build machine only — on any other machine (including CI) Gradle aborts with
# "Java home supplied is invalid". Gradle now uses JAVA_HOME / PATH.
