name: Build APK

# Builds a real, installable debug APK on every push and hands it over as a
# downloadable artifact. This exists because the development sandbox has no
# JDK/Android SDK — GitHub's runners do, so the build is verified there instead
# of being claimed here.
#
# Download: Actions → the run → "Artifacts" → arohi-debug-apk (zip with app-debug.apk)
#
# Optional release signing (only if you add these repository secrets):
#   KEYSTORE_BASE64  – base64 of your .jks  (base64 -w0 keystore.jks)
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Without them the workflow still builds and uploads the DEBUG apk.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # NOTE: the `secrets` context is NOT available inside a step's `if:`
    # expression (GitHub rejects the whole workflow at startup — that is what
    # produced an instant "failure" with zero jobs). Secrets are exposed as
    # job-level env values here, and steps test `env.*` instead.
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 34 + build-tools
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          yes | sdkmanager --licenses > /dev/null || true

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Static verification gate (fast fail)
        run: python3 tools/static_check.py

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arohi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ---------- optional signed release ----------
      - name: Decode keystore (optional)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/arohi-release.jks"

      - name: Assemble signed release (optional)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/arohi-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload release APK (optional)
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: arohi-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # Keeps the build log next to the APK so a failure can actually be diagnosed.
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            **/build/reports/**
          if-no-files-found: ignore
