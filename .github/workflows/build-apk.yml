name: Build APK

# Builds a real, installable debug APK on every push and hands it over as a
# downloadable artifact. This exists because the development sandbox has no
# JDK/Android SDK — GitHub's runners do, so the build is verified there instead
# of being claimed here.
#
# Download: Actions → the run → "Artifacts" → arohi-debug-apk (zip with app-debug.apk)
#
# Optional release signing (only if you add these repository secrets):
#   KEYSTORE_BASE64  – base64 of your .jks  (base64 -w0 keystore.jks)
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Without them the workflow still builds and uploads the DEBUG apk.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # NOTE: the `secrets` context is NOT available inside a step's `if:`
    # expression (GitHub rejects the whole workflow at startup — that is what
    # produced an instant "failure" with zero jobs). Secrets are exposed as
    # job-level env values here, and steps test `env.*` instead.
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu runner image already ships an Android SDK. Third-party setup
      # actions (android-actions/setup-android@v3) started failing here when the
      # runner forced Node 24, so the SDK is prepared directly instead — fewer
      # moving parts, no dependency on an unmaintained action.
      - name: Prepare Android SDK 34
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "${ANDROID_HOME}" ]; then
            if [ -d "$HOME/Android/Sdk" ]; then export ANDROID_HOME="$HOME/Android/Sdk"
            elif [ -d "/usr/local/lib/android/sdk" ]; then export ANDROID_HOME="/usr/local/lib/android/sdk"
            fi
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found — no Android SDK on this runner"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -5
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          ls "$ANDROID_HOME/platforms" || true

      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Static verification gate (fast fail)
        run: python3 tools/static_check.py

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee /tmp/gradle-test.log

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-report
          path: app/build/reports/tests/**
          if-no-files-found: ignore

      - name: Assemble debug APK
        # Output is tee'd so failures can be reported back as check annotations
        # (workflow logs are not always downloadable, annotations are).
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee /tmp/gradle-build.log

      - name: Report compiler errors
        if: failure()
        run: |
          set +e
          LOG=/tmp/gradle-build.log
          [ -f "$LOG" ] || { echo "::error::no gradle log was produced"; exit 0; }

          # 1) every Kotlin/Java diagnostic becomes one annotation
          grep -E "^(e|w): " "$LOG" | head -25 | while IFS= read -r line; do
            echo "::error::$(printf '%s' "$line" | tr -d '\r' | cut -c1-450)"
          done

          # 2) the failure block itself: "* What went wrong:" + following lines,
          #    plus any "Caused by" / "Could not" lines. This is what actually
          #    names the problem when the build stops before compilation.
          awk '/What went wrong/{f=1;next} f&&NR>0{print; c++; if(c>=12) exit}' "$LOG" \
            | sed '/^[[:space:]]*$/d' | head -12 | while IFS= read -r line; do
            echo "::error::$(printf '%s' "$line" | tr -d '\r' | cut -c1-450)"
          done
          grep -E "Caused by|Could not (find|resolve|download|create)|A problem occurred|Execution failed|Unsupported class file|requires (Java|JDK)" "$LOG" \
            | head -8 | while IFS= read -r line; do
            echo "::error::$(printf '%s' "$line" | tr -d '\r' | cut -c1-450)"
          done

          # 3) short tail for context
          tail -25 "$LOG" | sed 's/^/    /'

      # Proves the built file is a real, installable Android package with the
      # expected identity — printed as annotations so the facts are visible even
      # when the binary itself cannot be downloaded.
      - name: Verify APK identity
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK ($(stat -c%s "$APK") bytes)"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -r | head -1)
          "$AAPT" dump badging "$APK" > /tmp/badging.txt
          PKG=$(grep -oP "^package: name='\\K[^']+" /tmp/badging.txt)
          VC=$(grep -oP "versionCode='\\K[^']+" /tmp/badging.txt)
          VN=$(grep -oP "versionName='\\K[^']+" /tmp/badging.txt)
          MIN=$(grep -oP "sdkVersion:'\\K[^']+" /tmp/badging.txt)
          TGT=$(grep -oP "targetSdkVersion:'\\K[^']+" /tmp/badging.txt)
          ACT=$(grep -oP "launchable-activity: name='\\K[^']+" /tmp/badging.txt | head -1)
          echo "::notice::APK $PKG v$VN (code $VC), minSdk $MIN, targetSdk $TGT, launcher $ACT"
          test "$PKG" = "com.arohi.ai"          || { echo "::error::unexpected package $PKG"; exit 1; }
          test "$MIN" -le 28                     || { echo "::error::minSdk $MIN is above 28"; exit 1; }
          test "$TGT" = "34"                     || { echo "::error::targetSdk $TGT != 34"; exit 1; }
          test -n "$ACT"                         || { echo "::error::no launcher activity"; exit 1; }
          echo "::notice::APK signature: $(grep -c . /tmp/badging.txt) manifest lines parsed, permissions:"
          grep -c "uses-permission" /tmp/badging.txt | sed 's/^/  declared permissions: /'

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: arohi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ---------- optional signed release ----------
      - name: Decode keystore (optional)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/arohi-release.jks"

      - name: Assemble signed release (optional)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/arohi-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload release APK (optional)
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: arohi-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # Keeps the build log next to the APK so a failure can actually be diagnosed.
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-reports
          path: |
            app/build/reports/**
            **/build/reports/**
          if-no-files-found: ignore
